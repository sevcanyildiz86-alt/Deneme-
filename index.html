<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Music Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="text-align:center; margin-top:100px;">

<h2>Butona basınca müzik çalmalı</h2>

<button style="font-size:24px;" onclick="playMusic()">
▶️ PLAY MUSIC
</button>

<audio id="music">
  <source src="until-i-found-you.mp3" type="audio/mpeg">
</audio>

<script>
function playMusic() {
  const audio = document.getElementById("music");
  audio.play().catch(e => alert("HATA: " + e));
}
</script>

</body>
</html>
